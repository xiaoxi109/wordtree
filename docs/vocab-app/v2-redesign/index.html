<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LexiCore · 背词 App 改进原型</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <!-- 状态栏 -->
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="sb-right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><path d="M1 8h2v2H1V8zm4-2h2v4H5V6zm4-2h2v6H9V4zm4-2h2v8h-2V2z" fill="currentColor"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor"/><path d="M23 4v4c1-.4 1.5-1 1.5-2s-.5-1.6-1.5-2z" fill="currentColor" opacity="0.5"/></svg>
      </span>
    </div>

    <!-- 屏幕内容 -->
    <div class="screen" id="screen"></div>

    <!-- 底部 Tab -->
    <div class="tabbar">
      <div class="tabbar-inner" id="tabbar"></div>
    </div>

    <!-- 全屏层（Sheet / Reader） -->
    <div id="overlay"></div>
  </div>
</div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
